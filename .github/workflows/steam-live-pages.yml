name: LudoScope · Update Steam player heat and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # About every 15 minutes; GitHub may delay individual scheduled runs.
    - cron: '4,19,34,49 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ludoscope-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch current player counts from Steam
        run: python scripts/update_live_players.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
